<html vid="0"><head vid="1">
    <meta charset="UTF-8" vid="2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" vid="3">
    <script src="https://cdn.tailwindcss.com" vid="4"></script>
    <style vid="5">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .dot-pattern {
            background-image: radial-gradient(circle, #000 1.5px, transparent 1.5px);
            background-size: 12px 12px;
        }
        
        .chart-line {
            height: 2px;
            background: #000;
            position: relative;
        }
        
        .chart-marker {
            width: 8px;
            height: 8px;
            border: 2px solid #000;
            background: #FFD029;
            border-radius: 50%;
            position: absolute;
            top: -4px;
        }
    </style>
</head>
<body class="bg-[#f5f5f5]" vid="6">
    <div class="max-w-md mx-auto h-screen flex flex-col" vid="7">
        <!-- Header -->
        <div class="p-6 pt-14" vid="8">
            <h1 class="text-3xl font-bold tracking-tight" vid="9">Travel Guide</h1>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-auto px-4" vid="10">
            <!-- Compass Card -->
            <div class="bg-[#f5f5f5] rounded-xl mb-4 p-6 shadow-sm" vid="11">
                <h2 class="text-lg font-semibold mb-6" vid="12">Current Direction</h2>
                <div class="relative w-48 h-48 mx-auto mb-4" vid="13">
                    <div class="w-full h-full rounded-full border-[1.5px] border-gray-300" vid="14"></div>
                    <div class="absolute inset-0 w-full h-full rounded-full" style="background: repeating-radial-gradient(circle, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px)" vid="15"></div>
                    <div class="absolute top-4 left-1/2 transform -translate-x-1/2 font-medium" vid="16">N</div>
                    <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 font-medium" vid="17">S</div>
                    <div class="absolute left-4 top-1/2 transform -translate-y-1/2 font-medium" vid="18">W</div>
                    <div class="absolute right-4 top-1/2 transform -translate-y-1/2 font-medium" vid="19">E</div>
                    
                    <!-- Compass Needle -->
                    <div class="absolute left-1/2 top-1/2 w-2 h-20 -mt-10 -ml-1 transform origin-center" vid="20">
                        <div class="w-full h-1/2 bg-black rounded-t-full" vid="21"></div>
                        <div class="w-full h-1/2 bg-gray-400 rounded-b-full" vid="22"></div>
                    </div>
                </div>
            </div>

            <!-- Destinations Grid -->
            <div class="grid grid-cols-2 gap-4 mb-6" vid="23">
                <!-- Destination 1 -->
                <div class="bg-[#FFD029] rounded-xl p-4 relative overflow-hidden" vid="24">
                    <h3 class="font-medium mb-1" vid="25">Paris</h3>
                    <div class="dot-pattern w-24 h-24 mx-auto opacity-90" vid="26"></div>
                    <p class="text-4xl font-bold mt-2" vid="27">26°</p>
                </div>
                
                <!-- Destination 2 -->
                <div class="bg-white rounded-xl p-4 relative overflow-hidden" vid="28">
                    <h3 class="font-medium mb-1" vid="29">Tokyo</h3>
                    <div class="dot-pattern w-24 h-24 mx-auto opacity-90" vid="30"></div>
                    <p class="text-4xl font-bold mt-2" vid="31">18°</p>
                </div>
                
                <!-- Destination 3 -->
                <div class="bg-white rounded-xl p-4 relative overflow-hidden" vid="32">
                    <h3 class="font-medium mb-1" vid="33">Cairo</h3>
                    <div class="dot-pattern w-24 h-24 mx-auto opacity-90" vid="34"></div>
                    <p class="text-4xl font-bold mt-2" vid="35">32°</p>
                </div>
                
                <!-- Destination 4 -->
                <div class="bg-white rounded-xl p-4 relative overflow-hidden" vid="36">
                    <h3 class="font-medium mb-1" vid="37">Sydney</h3>
                    <div class="dot-pattern w-24 h-24 mx-auto opacity-90" vid="38"></div>
                    <p class="text-4xl font-bold mt-2" vid="39">22°</p>
                </div>
            </div>

            <!-- Detail Card -->
            <div class="bg-[#FFD029] rounded-xl p-6 mb-6" vid="40">
                <div class="flex justify-between items-start mb-6" vid="41">
                    <div vid="42">
                        <h2 class="text-2xl font-bold" vid="43">Paris</h2>
                        <p class="text-xl text-black/70" vid="44">26° Sunny</p>
                    </div>
                    <button vid="45">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" vid="46">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" vid="47"></path>
                        </svg>
                    </button>
                </div>
                
                <!-- Weather Icon -->
                <div class="dot-pattern w-40 h-40 mx-auto mb-8 opacity-90" vid="48"></div>
                
                <!-- Stats -->
                <div class="grid grid-cols-3 gap-4 mb-8" vid="49">
                    <div class="text-center" vid="50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" vid="51">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" vid="52"></path>
                        </svg>
                        <p class="font-bold" vid="53">42%</p>
                        <p class="text-xs text-black/70" vid="54">Humidity</p>
                    </div>
                    <div class="text-center" vid="55">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" vid="56">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" vid="57"></path>
                        </svg>
                        <p class="font-bold" vid="58">3KM/H</p>
                        <p class="text-xs text-black/70" vid="59">Wind</p>
                    </div>
                    <div class="text-center" vid="60">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" vid="61">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707" vid="62"></path>
                        </svg>
                        <p class="font-bold" vid="63">15%</p>
                        <p class="text-xs text-black/70" vid="64">UV Index</p>
                    </div>
                </div>
                
                <!-- Chart -->
                <div class="relative h-16 mb-2" vid="65">
                    <div class="absolute bottom-0 left-0 right-0" vid="66">
                        <div class="relative h-10" vid="67">
                            <div class="absolute bottom-0 left-0 right-0 h-px bg-black/20" vid="68"></div>
                            <svg viewBox="0 0 300 40" preserveAspectRatio="none" class="w-full h-10" vid="69">
                                <path d="M0,20 C30,28 60,10 90,15 C120,20 150,30 180,25 C210,20 240,15 270,18 C300,21 330,19 360,14" fill="none" stroke="black" stroke-width="2" vid="70"></path>
                            </svg>
                            <div class="chart-marker" style="left: 55%;" vid="71"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Time labels -->
                <div class="grid grid-cols-7 text-xs" vid="72">
                    <div class="text-center text-black/70" vid="73">8 AM</div>
                    <div class="text-center text-black/70" vid="74">10 AM</div>
                    <div class="text-center text-black/70" vid="75">12 PM</div>
                    <div class="text-center font-bold" vid="76">NOW</div>
                    <div class="text-center text-black/70" vid="77">4 PM</div>
                    <div class="text-center text-black/70" vid="78">6 PM</div>
                    <div class="text-center text-black/70" vid="79">8 PM</div>
                </div>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="p-4 flex justify-between border-t border-gray-200" vid="80">
            <button class="text-center" vid="81">
                <span class="block w-8 h-1 bg-black mx-auto mb-1" vid="82"></span>
                <span class="text-xs font-medium" vid="83">Today</span>
            </button>
            <button class="text-center opacity-30" vid="84">
                <span class="block w-8 h-1 bg-gray-300 mx-auto mb-1" vid="85"></span>
                <span class="text-xs font-medium" vid="86">Tomorrow</span>
            </button>
        </div>
    </div>

</body></html>
