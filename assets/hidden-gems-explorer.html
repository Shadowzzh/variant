        .compass {
            position: relative;
            width: 40px;
            height: 40px;
            border: 1px solid white;
            border-radius: 50%;
        }
        
        .compass::before,
        .compass::after {
            content: '';
            position: absolute;
            background-color: white;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        
        .compass::before {
            width: 1px;
            height: 30px;
        }
        
        .compass::after {
            width: 30px;
            height: 1px;
        }
        
        .n, .e, .s, .w {
            position: absolute;
            font-size: 8px;
        }
        
        .n { top: 2px; left: 50%; transform: translateX(-50%); }
        .e { right: 2px; top: 50%; transform: translateY(-50%); }
        .s { bottom: 2px; left: 50%; transform: translateX(-50%); }
        .w { left: 2px; top: 50%; transform: translateY(-50%); }
        
        .progress-bar {
            height: 4px;
            background-color: rgba(255, 255, 255, 0.2);
            position: relative;
        }
        
        .progress-value {
            height: 100%;
            background-color: white;
        }
        
        .barcode {

            background-size: 20px 100%;
            height: 40px;
        }
    </style>
</head>
