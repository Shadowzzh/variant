<html vid="0"><head vid="1">
    <meta charset="UTF-8" vid="2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" vid="3">
    <script src="https://cdn.tailwindcss.com" vid="4"></script>
    <style vid="5">
        @font-face {
            font-family: 'MonoFont';
            src: url('https://fonts.gstatic.com/s/spacemono/v12/i7dPIFZifjKcF5UAWdDRYE58RWq7.woff2') format('woff2');
        }
        
        body {
            font-family: 'MonoFont', monospace;
            background-color: #000;
            color: #fff;
        }
        
        .vertical-lines {
            background-image: repeating-linear-gradient(to right, rgba(255,255,255,0.1) 0px, rgba(255,255,255,0.1) 1px, transparent 1px, transparent 8px);
        }
        
        .effect-pill {
            border: 1px solid rgba(255,255,255,0.2);
            background-color: rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
        
        .effect-pill.active {
            background-color: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.4);
        }
        
        .camera-button {
            width: 70px;
            height: 70px;
            border: 2px solid white;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        
        .camera-button:active .camera-inner {
            background-color: rgba(255,255,255,0.5);
        }
        
        .camera-inner {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.2);
            transition: all 0.2s ease;
        }
        
        #cameraFeed {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }
        
        .flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease;
        }
        
        .filter-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0.75;
            display: none;
        }
        
        .gallery-item {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .gallery-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 50;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
        }
        
        .gallery-container.active {
            transform: translateY(0);
        }
        
        .intensity-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.2);
            outline: none;
        }
        
        .intensity-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }
    </style>
</head>
<body class="min-h-screen text-xs uppercase tracking-wider" vid="6">
    <div class="relative h-screen flex flex-col bg-black overflow-hidden" vid="7">
        <!-- Header -->
        <div class="flex justify-between items-center p-4 z-10" vid="8">
            <div class="flex items-center" vid="9">
                <span class="text-xs tracking-widest" vid="10">PIXL-AI</span>
            </div>
            <div class="flex items-center space-x-4" vid="11">
                <span class="text-xs tracking-widest opacity-50" id="versionDisplay" vid="12">V 1.0.4</span>
            </div>
        </div>
        
        <!-- Camera Preview -->
        <div class="relative flex-1 bg-gray-900 overflow-hidden" vid="13">
            <video id="cameraFeed" autoplay="" playsinline="" muted="" vid="14"></video>
            
            <!-- Filter Overlays -->
            <div id="portraitFilter" class="filter-preview" style="background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.6) 80%);" vid="15"></div>
            <div id="vintageFilter" class="filter-preview" style="background: linear-gradient(to bottom right, rgba(255,200,100,0.2), rgba(100,50,0,0.2));" vid="16"></div>
            <div id="neonFilter" class="filter-preview" style="background: linear-gradient(45deg, rgba(0,255,255,0.2), rgba(255,0,255,0.2));" vid="17"></div>
            <div id="cyberpunkFilter" class="filter-preview" style="background: linear-gradient(to right, rgba(0,255,255,0.2) 0%, rgba(255,0,255,0.2) 50%, rgba(255,255,0,0.2) 100%);" vid="18"></div>
            <div id="animeFilter" class="filter-preview" style="background: linear-gradient(to bottom, rgba(255,100,255,0.1), rgba(100,200,255,0.1));" vid="19"></div>
            
            <!-- Flash Effect -->
            <div id="flashOverlay" class="flash-overlay" vid="20"></div>
            
            <!-- Camera UI Overlay -->
            <div class="absolute inset-0 flex flex-col justify-between p-4" vid="21">
                <!-- Top Camera Controls -->
                <div class="flex justify-between items-center" vid="22">
                    <div id="cameraToggle" class="bg-black bg-opacity-50 px-3 py-1 rounded-sm" vid="23">
                        <span class="text-xs tracking-widest" vid="24">FRONT</span>
                    </div>
                    <div id="flashToggle" class="bg-black bg-opacity-50 px-3 py-1 rounded-sm" vid="25">
                        <span class="text-xs tracking-widest" vid="26">FLASH OFF</span>
                    </div>
                </div>
                
                <!-- Bottom Camera Controls -->
                <div vid="27">
                    <!-- AI Effect Indicators -->
                    <div class="mb-6 vertical-lines h-8 w-full" vid="28"></div>
                    
                    <!-- Current Effect -->
                    <div class="flex justify-between items-center mb-4" vid="29">
                        <div class="text-xs tracking-widest" vid="30">
                            <span class="opacity-50" vid="31">EFFECT /</span>
                            <span id="currentEffect" vid="32"> PORTRAIT</span>
                        </div>
                        <div class="text-xs tracking-widest" vid="33">
                            <span class="opacity-50" vid="34">INTENSITY</span>
                            <span id="intensityValue" vid="35"> 75%</span>
                        </div>
                    </div>
                    
                    <!-- Intensity Slider -->
                    <input type="range" id="intensitySlider" class="intensity-slider" min="0" max="100" value="75" vid="36">
                </div>
            </div>
        </div>
        
        <!-- Bottom Controls -->
        <div class="bg-black p-4 z-10" vid="37">
            <!-- Effects Row -->
            <div class="flex justify-between items-center mb-6 overflow-x-auto pb-2 -mx-2 px-2" vid="38">
                <div class="effect-pill px-3 py-1 rounded-sm mr-3 whitespace-nowrap active" data-effect="portrait" vid="39">
                    <span class="text-xs tracking-widest" vid="40">PORTRAIT</span>
                </div>
                <div class="effect-pill px-3 py-1 rounded-sm mr-3 whitespace-nowrap opacity-50" data-effect="vintage" vid="41">
                    <span class="text-xs tracking-widest" vid="42">VINTAGE</span>
                </div>
                <div class="effect-pill px-3 py-1 rounded-sm mr-3 whitespace-nowrap opacity-50" data-effect="neon" vid="43">
                    <span class="text-xs tracking-widest" vid="44">NEON</span>
                </div>
                <div class="effect-pill px-3 py-1 rounded-sm mr-3 whitespace-nowrap opacity-50" data-effect="cyberpunk" vid="45">
                    <span class="text-xs tracking-widest" vid="46">CYBERPUNK</span>
                </div>
                <div class="effect-pill px-3 py-1 rounded-sm whitespace-nowrap opacity-50" data-effect="anime" vid="47">
                    <span class="text-xs tracking-widest" vid="48">ANIME</span>
                </div>
            </div>
            
            <!-- Camera Controls -->
            <div class="flex justify-between items-center" vid="49">
                <button id="galleryButton" class="w-12 h-12 flex items-center justify-center" vid="50">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6" vid="51">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14" vid="52"></path>
                    </svg>
                </button>
                
                <div id="captureButton" class="camera-button flex items-center justify-center" vid="53">
                    <div class="camera-inner" vid="54"></div>
                </div>
                
                <button id="switchCameraButton" class="w-12 h-12 flex items-center justify-center" vid="55">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6" vid="56">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" vid="57"></path>
                    </svg>
                </button>
            </div>
            
            <!-- Bottom Info -->
            <div class="mt-6 flex justify-between items-center" vid="58">
                <div class="text-xs tracking-widest opacity-50" vid="59">
                    <span vid="60">SK_CAMERA_AI_PROCESSOR</span>
                </div>
                <div class="text-xs tracking-widest" vid="61">
                    <span class="opacity-50" vid="62">IMAGES /</span>
                    <span id="imageCount" vid="63"> 0</span>
                </div>
            </div>
        </div>
        
        <!-- Action Button -->
        <div class="p-4 z-10" vid="64">
            <button id="galleryFullButton" class="w-full bg-black border border-white/20 py-3 text-center text-xs tracking-widest" vid="65">
                GO TO GALLERY
            </button>
        </div>
        
        <!-- Gallery View -->
        <div id="galleryContainer" class="gallery-container" vid="66">
            <div class="flex justify-between items-center p-4" vid="67">
                <div class="flex items-center" vid="68">
                    <span class="text-xs tracking-widest" vid="69">GALLERY</span>
                </div>
                <button id="closeGalleryButton" class="text-xs tracking-widest" vid="70">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6" vid="71">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M6 18L18 6M6 6l12 12" vid="72"></path>
                    </svg>
                </button>
            </div>
            
            <div id="galleryGrid" class="grid grid-cols-3 gap-1 p-1 overflow-y-auto" style="height: calc(100% - 120px);" vid="73">
                <!-- Gallery items will be added here dynamically -->
            </div>
            
            <div class="p-4" vid="74">
                <div class="text-xs tracking-widest text-center opacity-50 mb-2" vid="75">ALL IMAGES SAVED TO DEVICE</div>
                <button id="clearGalleryButton" class="w-full border border-white/20 py-3 text-center text-xs tracking-widest" vid="76">
                    CLEAR GALLERY
                </button>
            </div>
        </div>
        
        <!-- Canvas for capturing photos (hidden) -->
        <canvas id="captureCanvas" class="hidden" vid="77"></canvas>
    </div>

    <script vid="78">
        // DOM Elements
        const cameraFeed = document.getElementById('cameraFeed');
        const captureButton = document.getElementById('captureButton');
        const switchCameraButton = document.getElementById('switchCameraButton');
        const cameraToggle = document.getElementById('cameraToggle');
        const flashToggle = document.getElementById('flashToggle');
        const flashOverlay = document.getElementById('flashOverlay');
        const effectPills = document.querySelectorAll('.effect-pill');
        const currentEffect = document.getElementById('currentEffect');
        const intensitySlider = document.getElementById('intensitySlider');
        const intensityValue = document.getElementById('intensityValue');
        const imageCount = document.getElementById('imageCount');
        const galleryButton = document.getElementById('galleryButton');
        const galleryFullButton = document.getElementById('galleryFullButton');
        const galleryContainer = document.getElementById('galleryContainer');
        const closeGalleryButton = document.getElementById('closeGalleryButton');
        const galleryGrid = document.getElementById('galleryGrid');
        const clearGalleryButton = document.getElementById('clearGalleryButton');
        const captureCanvas = document.getElementById('captureCanvas');
        const filterPreviews = document.querySelectorAll('.filter-preview');
        
        // Camera state
        let stream = null;
        let facingMode = 'user'; // 'user' for front camera, 'environment' for back
        let flashMode = 'off';
        let currentFilterName = 'portrait';
        let capturedImages = [];
        
        // Load saved images from localStorage
        function loadSavedImages() {
            const savedImages = localStorage.getItem('pixlAiImages');
            if (savedImages) {
                capturedImages = JSON.parse(savedImages);
                updateImageCount();
                renderGallery();
            }
        }
        
        // Save images to localStorage
        function saveImages() {
            localStorage.setItem('pixlAiImages', JSON.stringify(capturedImages));
        }
        
        // Initialize camera
        async function initCamera() {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };
                
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                cameraFeed.srcObject = stream;
                
                // Update camera toggle text
                cameraToggle.querySelector('span').textContent = facingMode === 'user' ? 'FRONT' : 'BACK';
                
            } catch (error) {
                console.error('Error accessing camera:', error);
                alert('Unable to access camera. Please check permissions and try again.');
            }
        }
        
        // Switch camera (front/back)
        function switchCamera() {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            initCamera();
        }
        
        // Toggle flash mode
        function toggleFlash() {
            if (flashMode === 'off') {
                flashMode = 'on';
                flashToggle.querySelector('span').textContent = 'FLASH ON';
            } else {
                flashMode = 'off';
                flashToggle.querySelector('span').textContent = 'FLASH OFF';
            }
        }
        
        // Apply filter effect
        function applyFilter(filterName) {
            // Hide all filter previews
            filterPreviews.forEach(filter => {
                filter.style.display = 'none';
            });
            
            // Show selected filter
            const selectedFilter = document.getElementById(`${filterName}Filter`);
            if (selectedFilter) {
                selectedFilter.style.display = 'block';
                selectedFilter.style.opacity = intensitySlider.value / 100;
            }
            
            // Update UI
            currentFilterName = filterName;
            currentEffect.textContent = ` ${filterName.toUpperCase()}`;
            
            // Update effect pills
            effectPills.forEach(pill => {
                pill.classList.remove('active');
                pill.classList.add('opacity-50');
                
                if (pill.dataset.effect === filterName) {
                    pill.classList.add('active');
                    pill.classList.remove('opacity-50');
                }
            });
        }
        
        // Update filter intensity
        function updateIntensity() {
            const intensity = intensitySlider.value;
            intensityValue.textContent = ` ${intensity}%`;
            
            // Update active filter opacity
            const activeFilter = document.getElementById(`${currentFilterName}Filter`);
            if (activeFilter) {
                activeFilter.style.opacity = intensity / 100;
            }
        }
        
        // Capture photo
        function capturePhoto() {
            if (!stream) return;
            
            // Flash effect if enabled
            if (flashMode === 'on') {
                flashOverlay.style.opacity = '1';
                setTimeout(() => {
                    flashOverlay.style.opacity = '0';
                }, 150);
            }
            
            // Set canvas dimensions to match video
            const videoWidth = cameraFeed.videoWidth;
            const videoHeight = cameraFeed.videoHeight;
            captureCanvas.width = videoWidth;
            captureCanvas.height = videoHeight;
            
            // Draw video frame to canvas
            const context = captureCanvas.getContext('2d');
            context.drawImage(cameraFeed, 0, 0, videoWidth, videoHeight);
            
            // Apply filter effect to canvas (simplified version)
            if (currentFilterName !== 'none') {
                const intensity = intensitySlider.value / 100;
                
                // Apply different filter effects based on the selected filter
                switch(currentFilterName) {
                    case 'portrait':
                        // Vignette effect for portrait mode
                        const gradient = context.createRadialGradient(
                            videoWidth/2, videoHeight/2, videoWidth*0.3,
                            videoWidth/2, videoHeight/2, videoWidth*0.8
                        );
                        gradient.addColorStop(0, 'rgba(0,0,0,0)');
                        gradient.addColorStop(1, `rgba(0,0,0,${0.6 * intensity})`);
                        context.fillStyle = gradient;
                        context.globalCompositeOperation = 'source-over';
                        context.fillRect(0, 0, videoWidth, videoHeight);
                        break;
                        
                    case 'vintage':
                        // Sepia-like effect for vintage
                        context.globalCompositeOperation = 'color';
                        context.fillStyle = `rgba(255,200,100,${0.2 * intensity})`;
                        context.fillRect(0, 0, videoWidth, videoHeight);
                        break;
                        
                    case 'neon':
                        // Neon color effect
                        context.globalCompositeOperation = 'screen';
                        const neonGradient = context.createLinearGradient(0, 0, videoWidth, videoHeight);
                        neonGradient.addColorStop(0, `rgba(0,255,255,${0.2 * intensity})`);
                        neonGradient.addColorStop(1, `rgba(255,0,255,${0.2 * intensity})`);
                        context.fillStyle = neonGradient;
                        context.fillRect(0, 0, videoWidth, videoHeight);
                        break;
                        
                    case 'cyberpunk':
                        // Cyberpunk color effect
                        context.globalCompositeOperation = 'screen';
                        const cyberGradient = context.createLinearGradient(0, 0, videoWidth, 0);
                        cyberGradient.addColorStop(0, `rgba(0,255,255,${0.2 * intensity})`);
                        cyberGradient.addColorStop(0.5, `rgba(255,0,255,${0.2 * intensity})`);
                        cyberGradient.addColorStop(1, `rgba(255,255,0,${0.2 * intensity})`);
                        context.fillStyle = cyberGradient;
                        context.fillRect(0, 0, videoWidth, videoHeight);
                        break;
                        
                    case 'anime':
                        // Anime-style color effect
                        context.globalCompositeOperation = 'screen';
                        const animeGradient = context.createLinearGradient(0, 0, 0, videoHeight);
                        animeGradient.addColorStop(0, `rgba(255,100,255,${0.1 * intensity})`);
                        animeGradient.addColorStop(1, `rgba(100,200,255,${0.1 * intensity})`);
                        context.fillStyle = animeGradient;
                        context.fillRect(0, 0, videoWidth, videoHeight);
                        break;
                }
                
                // Reset composite operation
                context.globalCompositeOperation = 'source-over';
            }
            
            // Get image data URL
            const imageDataUrl = captureCanvas.toDataURL('image/jpeg');
            
            // Save to gallery
            capturedImages.unshift({
                id: Date.now(),
                src: imageDataUrl,
                filter: currentFilterName,
                date: new Date().toISOString()
            });
            
            // Update UI and save
            updateImageCount();
            renderGallery();
            saveImages();
            
            // Feedback animation
            captureButton.classList.add('active');
            setTimeout(() => {
                captureButton.classList.remove('active');
            }, 200);
        }
        
        // Update image count display
        function updateImageCount() {
            imageCount.textContent = ` ${capturedImages.length}`;
        }
        
        // Render gallery items
        function renderGallery() {
            galleryGrid.innerHTML = '';
            
            capturedImages.forEach(image => {
                const item = document.createElement('div');
                item.className = 'relative';
                
                const img = document.createElement('img');
                img.src = image.src;
                img.className = 'gallery-item';
                img.alt = `Photo with ${image.filter} filter`;
                
                const filterBadge = document.createElement('div');
                filterBadge.className = 'absolute bottom-1 left-1 bg-black bg-opacity-50 px-2 py-0.5 text-[10px] tracking-wider';
                filterBadge.textContent = image.filter.toUpperCase();
                
                const deleteButton = document.createElement('button');
                deleteButton.className = 'absolute top-1 right-1 bg-black bg-opacity-50 p-1 rounded-full';
                deleteButton.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                `;
                
                deleteButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    capturedImages = capturedImages.filter(img => img.id !== image.id);
                    updateImageCount();
                    renderGallery();
                    saveImages();
                });
                
                item.appendChild(img);
                item.appendChild(filterBadge);
                item.appendChild(deleteButton);
                galleryGrid.appendChild(item);
            });
        }
        
        // Show gallery
        function showGallery() {
            galleryContainer.classList.add('active');
        }
        
        // Hide gallery
        function hideGallery() {
            galleryContainer.classList.remove('active');
        }
        
        // Clear gallery
        function clearGallery() {
            if (confirm('Are you sure you want to clear all photos?')) {
                capturedImages = [];
                updateImageCount();
                renderGallery();
                saveImages();
            }
        }
        
        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize camera
            initCamera();
            
            // Load saved images
            loadSavedImages();
            
            // Apply initial filter
            applyFilter('portrait');
            
            // Camera controls
            captureButton.addEventListener('click', capturePhoto);
            switchCameraButton.addEventListener('click', switchCamera);
            cameraToggle.addEventListener('click', switchCamera);
            flashToggle.addEventListener('click', toggleFlash);
            
            // Filter controls
            effectPills.forEach(pill => {
                pill.addEventListener('click', () => {
                    applyFilter(pill.dataset.effect);
                });
            });
            
            // Intensity slider
            intensitySlider.addEventListener('input', updateIntensity);
            
            // Gallery controls
            galleryButton.addEventListener('click', showGallery);
            galleryFullButton.addEventListener('click', showGallery);
            closeGalleryButton.addEventListener('click', hideGallery);
            clearGalleryButton.addEventListener('click', clearGallery);
            
            // Update version number randomly to simulate updates
            const versionDisplay = document.getElementById('versionDisplay');
            const randomVersion = `V ${Math.floor(Math.random() * 2) + 1}.${Math.floor(Math.random() * 10)}.${Math.floor(Math.random() * 10)}`;
            versionDisplay.textContent = randomVersion;
        });
        
        // Handle visibility change (pause camera when tab is not visible)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (stream) {
                    stream.getTracks().forEach(track => track.enabled = false);
                }
            } else {
                if (stream) {
                    stream.getTracks().forEach(track => track.enabled = true);
                } else {
                    initCamera();
                }
            }
        });
    </script>

</body></html>
