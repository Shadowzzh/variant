<html lang="en" vid="0"><head vid="1">
    <meta charset="UTF-8" vid="2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" vid="3">
    <title vid="4">Figment | AI Creative Canvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" vid="5">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" vid="6">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&amp;family=Syne:wght@400;700;800&amp;display=swap" rel="stylesheet" vid="7">
    
    

    <style vid="8">
        :root {
            --c-bg: #FFAAFA;
            --c-grid: #F184EB;
            --c-brand: #EF3922;
            --c-card-dark: #0E0E0E;
            --c-card-green: #1B7F4E;
            --c-card-orange: #F46927;
            --c-card-light: #F2F2F2;
            
            --f-display: 'Syne', sans-serif;
            --f-accent: 'Cormorant Garamond', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--c-bg);
            color: var(--c-brand);
            font-family: var(--f-display);
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            position: relative;
        }

        
        .bg-grid {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            z-index: 0;
            pointer-events: none;
            
            background-image: 
                linear-gradient(var(--c-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--c-grid) 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: center center;
            filter: url(#warp-filter);
            opacity: 0.7;
            animation: breathe 20s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.05) translate(-1%, -1%); }
        }

        
        nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; 
        }

        .nav-item {
            position: absolute;
            font-family: var(--f-accent);
            font-style: italic;
            font-size: 1.5rem;
            color: var(--c-brand);
            pointer-events: auto;
            cursor: pointer;
            padding: 2rem;
            transition: opacity 0.3s ease;
        }

        .nav-item:hover {
            opacity: 0.6;
        }

        .nav-item.brand { top: 0; left: 0; }
        .nav-item.login { top: 0; right: 0; }
        .nav-item.about { bottom: 0; left: 0; }
        .nav-item.manifesto { bottom: 0; right: 0; }

        
        main {
            position: relative;
            z-index: 5;
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-cluster {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            transform: translateY(-2vh); 
        }

        h1 {
            font-size: clamp(6rem, 12vw, 12rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 0.9;
            color: var(--c-brand);
            text-align: center;
            margin: 0;
            
        }

        .scallop-btn {
            position: relative;
            background: transparent;
            color: var(--c-brand);
            font-family: var(--f-display);
            font-size: 1.1rem;
            font-weight: 400;
            padding: 1rem 2.5rem;
            cursor: pointer;
            border: none;
            outline: none;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        
        .scallop-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            
            background-image: url("data:image/svg+xml,%3Csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='100%25' height='100%25' fill='none' rx='24' stroke='%23EF3922' stroke-width='2' stroke-dasharray='0, 20' stroke-linecap='round' /%3E%3C/svg%3E");
            
            mask-image: radial-gradient(circle at 10px 10px, transparent 0, transparent 9px, black 10px);
            mask-size: 20px 20px;
            mask-position: -10px -10px;
            border: 1.5px solid var(--c-brand);
            border-radius: 20px; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        
        .scallop-svg-wrapper {
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            z-index: -1;
            pointer-events: none;
        }
        
        .scallop-btn span {
            position: relative;
            z-index: 2;
        }

        .scallop-btn:hover {
            transform: scale(1.05);
        }
        .scallop-btn:hover path {
            fill: var(--c-brand);
        }
        .scallop-btn:hover span {
            color: var(--c-bg);
        }


        
        .orbit-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            z-index: 2;
        }

        .tool-card {
            position: absolute;
            width: 160px;
            height: 100px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            
            margin-top: -50px;
            margin-left: -80px;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .tool-card:hover {
            z-index: 10;
        }

        
        
        .card-1 { transform: translate(0px, -320px) rotate(-10deg); background: var(--c-card-green); animation: float 6s ease-in-out infinite alternate; }
        .card-2 { transform: translate(226px, -226px) rotate(15deg); background: var(--c-card-orange); animation: float 7s ease-in-out infinite alternate-reverse; }
        .card-3 { transform: translate(320px, 0px) rotate(-5deg); background: var(--c-card-dark); animation: float 5s ease-in-out infinite alternate; }
        .card-4 { transform: translate(226px, 226px) rotate(20deg); background: var(--c-card-orange); animation: float 8s ease-in-out infinite alternate-reverse; }
        .card-5 { transform: translate(0px, 320px) rotate(-15deg); background: var(--c-card-light); animation: float 6s ease-in-out infinite alternate; }
        .card-6 { transform: translate(-226px, 226px) rotate(10deg); background: var(--c-card-light); animation: float 7s ease-in-out infinite alternate-reverse; }
        .card-7 { transform: translate(-320px, 0px) rotate(-20deg); background: var(--c-card-light); animation: float 5s ease-in-out infinite alternate; }
        .card-8 { transform: translate(-226px, -226px) rotate(5deg); background: var(--c-card-dark); animation: float 8s ease-in-out infinite alternate-reverse; }

        .tool-card:hover.card-1 { transform: translate(0px, -320px) rotate(0deg) scale(1.15); }
        .tool-card:hover.card-2 { transform: translate(226px, -226px) rotate(0deg) scale(1.15); }
        .tool-card:hover.card-3 { transform: translate(320px, 0px) rotate(0deg) scale(1.15); }
        .tool-card:hover.card-4 { transform: translate(226px, 226px) rotate(0deg) scale(1.15); }
        .tool-card:hover.card-5 { transform: translate(0px, 320px) rotate(0deg) scale(1.15); }
        .tool-card:hover.card-6 { transform: translate(-226px, 226px) rotate(0deg) scale(1.15); }
        .tool-card:hover.card-7 { transform: translate(-320px, 0px) rotate(0deg) scale(1.15); }
        .tool-card:hover.card-8 { transform: translate(-226px, -226px) rotate(0deg) scale(1.15); }

        @keyframes float {
            0% { margin-top: -50px; }
            100% { margin-top: -65px; }
        }

        
        .card-art {
            width: 100%;
            height: 100%;
            position: relative;
        }

        
        .art-gen-flora svg { width: 100%; height: 100%; }
        
        
        .art-neural svg { width: 100%; height: 100%; }

        
        .art-style svg { width: 100%; height: 100%; }

        
        .art-nodes svg { width: 100%; height: 100%; }

        
        .art-motion svg { width: 100%; height: 100%; }

        
        .art-morph svg { width: 100%; height: 100%; }

        
        .art-canvas svg { width: 100%; height: 100%; }

        
        .art-vision svg { width: 100%; height: 100%; }


        
        @media (max-width: 900px) {
            .orbit-container { transform: scale(0.7); }
            h1 { font-size: 5rem; }
        }
        @media (max-width: 600px) {
            .orbit-container { transform: scale(0.45); }
            h1 { font-size: 3.5rem; }
            .nav-item { font-size: 1.2rem; padding: 1.5rem; }
            .bg-grid { background-size: 40px 40px; }
        }

    </style>
</head>
<body vid="9">

    
    <svg width="0" height="0" style="position:absolute; z-index:-1;" vid="10">
        <defs vid="11">
            
            <filter id="warp-filter" x="-20%" y="-20%" width="140%" height="140%" vid="12">
                <feTurbulence type="fractalNoise" baseFrequency="0.003" numOctaves="2" result="noise" vid="13"></feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="80" xChannelSelector="R" yChannelSelector="G" vid="14"></feDisplacementMap>
            </filter>

            
            <path id="scallop-path" d="M 20 4 C 24 0 30 0 34 4 C 38 0 44 0 48 4 C 52 0 58 0 62 4 C 66 0 72 0 76 4 C 80 0 86 0 90 4 C 94 0 100 0 104 4 C 108 0 114 0 118 4 C 122 0 128 0 132 4 C 136 0 142 0 146 4 C 150 0 156 0 160 4 C 166 8 166 14 166 20 C 170 24 170 30 166 34 C 170 38 170 44 166 48 C 160 52 150 56 146 56 C 142 60 136 60 132 56 C 128 60 122 60 118 56 C 114 60 108 60 104 56 C 100 60 94 60 90 56 C 86 60 80 60 76 56 C 72 60 66 60 62 56 C 58 60 52 60 48 56 C 44 60 38 60 34 56 C 30 60 24 60 20 56 C 14 52 14 48 14 48 C 10 44 10 38 14 34 C 10 30 10 24 14 20 C 14 14 14 8 20 4 Z" fill="none" stroke="var(--c-brand)" stroke-width="1.5" vid="15"></path>
        </defs>
    </svg>

    <div class="bg-grid" vid="16"></div>

    <nav vid="17">
        <div class="nav-item brand" vid="18">Figment</div>
        <div class="nav-item login" vid="19">Login</div>
        <div class="nav-item about" vid="20">About</div>
        <div class="nav-item manifesto" vid="21">Manifesto</div>
    </nav>

    <main vid="22">
        <div class="orbit-container" vid="23">
            
            <div class="tool-card card-1" title="Generative Flora" vid="24">
                <div class="card-art art-gen-flora" vid="25">
                    <svg viewBox="0 0 160 100" vid="26">
                        <circle cx="80" cy="50" r="30" fill="#F46927" vid="27"></circle>
                        <circle cx="80" cy="50" r="10" fill="#F2F2F2" vid="28"></circle>
                        <path d="M 65 35 Q 50 20 35 40 Q 50 55 65 35" fill="#EF3922" vid="29"></path>
                        <path d="M 95 35 Q 110 20 125 40 Q 110 55 95 35" fill="#EF3922" vid="30"></path>
                        <path d="M 80 65 L 80 100" stroke="#0E0E0E" stroke-width="4" vid="31"></path>
                        
                        <circle cx="30" cy="20" r="3" fill="#F2F2F2" vid="32"></circle>
                        <circle cx="130" cy="80" r="4" fill="#F46927" vid="33"></circle>
                    </svg>
                </div>
            </div>

            <div class="tool-card card-2" title="Neural Mapping" vid="34">
                <div class="card-art art-neural" vid="35">
                    <svg viewBox="0 0 160 100" vid="36">
                        <path d="M 20 50 Q 50 10 80 50 T 140 50" fill="none" stroke="#F2F2F2" stroke-width="3" vid="37"></path>
                        <rect x="70" y="40" width="20" height="20" rx="4" fill="#1B7F4E" vid="38"></rect>
                        <circle cx="35" cy="35" r="8" fill="#EF3922" vid="39"></circle>
                        <circle cx="125" cy="65" r="12" fill="#0E0E0E" vid="40"></circle>
                        <line x1="125" y1="65" x2="140" y2="80" stroke="#0E0E0E" stroke-width="2" vid="41"></line>
                        <circle cx="140" cy="80" r="4" fill="#1B7F4E" vid="42"></circle>
                    </svg>
                </div>
            </div>

            <div class="tool-card card-3" title="Style Transfer" vid="43">
                <div class="card-art art-style" vid="44">
                    <svg viewBox="0 0 160 100" vid="45">
                        <polygon points="40,20 120,20 100,80 60,80" fill="#F46927" vid="46"></polygon>
                        <polygon points="100,20 120,20 100,80" fill="#1B7F4E" vid="47"></polygon>
                        
                        <circle cx="80" cy="35" r="12" fill="#F2F2F2" vid="48"></circle>
                        <path d="M 60 80 L 75 50 L 85 50 L 100 80" fill="none" stroke="#F2F2F2" stroke-width="4" vid="49"></path>
                    </svg>
                </div>
            </div>

            <div class="tool-card card-4" title="Data Connect" vid="50">
                <div class="card-art art-nodes" vid="51">
                    <svg viewBox="0 0 160 100" vid="52">
                        <circle cx="50" cy="50" r="25" fill="#EF3922" vid="53"></circle>
                        <circle cx="100" cy="40" r="35" fill="#1B7F4E" opacity="0.9" vid="54"></circle>
                        <circle cx="80" cy="70" r="15" fill="#0E0E0E" vid="55"></circle>
                        <circle cx="100" cy="40" r="10" fill="#F46927" vid="56"></circle>
                        
                        <circle cx="140" cy="20" r="3" fill="#0E0E0E" vid="57"></circle>
                        <circle cx="20" cy="80" r="5" fill="#1B7F4E" vid="58"></circle>
                    </svg>
                </div>
            </div>

            <div class="tool-card card-5" title="Physics Canvas" vid="59">
                <div class="card-art art-motion" vid="60">
                    <svg viewBox="0 0 160 100" vid="61">
                        
                        <line x1="0" y1="20" x2="160" y2="20" stroke="#E0E0E0" stroke-width="1" vid="62"></line>
                        <line x1="0" y1="40" x2="160" y2="40" stroke="#E0E0E0" stroke-width="1" vid="63"></line>
                        <line x1="0" y1="60" x2="160" y2="60" stroke="#E0E0E0" stroke-width="1" vid="64"></line>
                        <line x1="0" y1="80" x2="160" y2="80" stroke="#E0E0E0" stroke-width="1" vid="65"></line>
                        
                        <path d="M 30 70 L 130 70" stroke="#EF3922" stroke-width="3" stroke-linecap="round" vid="66"></path>
                        <rect x="70" y="50" width="20" height="20" fill="#0E0E0E" vid="67"></rect>
                        <circle cx="95" cy="55" r="5" fill="#F46927" vid="68"></circle>
                        <line x1="75" y1="70" x2="70" y2="85" stroke="#0E0E0E" stroke-width="3" vid="69"></line>
                        <line x1="85" y1="70" x2="90" y2="85" stroke="#0E0E0E" stroke-width="3" vid="70"></line>
                    </svg>
                </div>
            </div>

            <div class="tool-card card-6" title="Geometry Morph" vid="71">
                <div class="card-art art-morph" vid="72">
                    <svg viewBox="0 0 160 100" vid="73">
                        <path d="M 20 20 Q 80 -10 140 20 T 140 80 Q 80 110 20 80 T 20 20" fill="#0E0E0E" vid="74"></path>
                        <circle cx="50" cy="40" r="15" fill="#F46927" vid="75"></circle>
                        <rect x="90" y="50" width="25" height="25" rx="12" fill="#1B7F4E" vid="76"></rect>
                        <path d="M 65 65 L 85 35" stroke="#F2F2F2" stroke-width="3" stroke-linecap="round" vid="77"></path>
                    </svg>
                </div>
            </div>

            <div class="tool-card card-7" title="Vector Abstraction" vid="78">
                <div class="card-art art-canvas" vid="79">
                    <svg viewBox="0 0 160 100" vid="80">
                        
                        <path d="M 80 90 L 60 40 L 100 40 Z" fill="#EF3922" opacity="0.8" vid="81"></path>
                        <circle cx="60" cy="40" r="12" fill="#1B7F4E" vid="82"></circle>
                        <rect x="90" y="30" width="20" height="20" fill="#F46927" transform="rotate(15 100 40)" vid="83"></rect>
                        <line x1="80" y1="90" x2="40" y2="20" stroke="#0E0E0E" stroke-width="2" vid="84"></line>
                        <line x1="80" y1="90" x2="120" y2="15" stroke="#0E0E0E" stroke-width="2" vid="85"></line>
                    </svg>
                </div>
            </div>

            <div class="tool-card card-8" title="AI Vision" vid="86">
                <div class="card-art art-vision" vid="87">
                    <svg viewBox="0 0 160 100" vid="88">
                        <path d="M 30 50 Q 80 10 130 50 Q 80 90 30 50" fill="#1B7F4E" vid="89"></path>
                        <circle cx="80" cy="50" r="20" fill="#F2F2F2" vid="90"></circle>
                        <circle cx="80" cy="50" r="8" fill="#EF3922" vid="91"></circle>
                        
                        <path d="M 20 20 L 30 25 M 25 15 L 20 25" stroke="#F46927" stroke-width="2" vid="92"></path>
                        <path d="M 140 80 L 130 75 M 135 85 L 140 75" stroke="#F46927" stroke-width="2" vid="93"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div class="center-cluster" vid="94">
            <h1 vid="95">Imagine.</h1>
            <button class="scallop-btn" vid="96">
                <div class="scallop-svg-wrapper" vid="97">
                    
                    <svg width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 180 60" vid="98">
                        
                        <path d="
                            M 30 2 
                            Q 40 5 50 2 Q 60 -1 70 2 Q 80 5 90 2 Q 100 -1 110 2 Q 120 5 130 2 Q 140 -1 150 2 
                            A 28 28 0 0 1 178 30
                            A 28 28 0 0 1 150 58
                            Q 140 61 130 58 Q 120 55 110 58 Q 100 61 90 58 Q 80 55 70 58 Q 60 61 50 58 Q 40 55 30 58 
                            A 28 28 0 0 1 2 30
                            A 28 28 0 0 1 30 2 Z" fill="none" stroke="var(--c-brand)" stroke-width="1.5" stroke-linejoin="round" style="transition: fill 0.3s ease;" vid="99"></path>
                    </svg>
                </div>
                <span vid="100">Start creating</span>
            </button>
        </div>
    </main>


</body></html>
