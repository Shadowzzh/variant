<html lang="en" vid="0"><head vid="1">
<meta charset="UTF-8" vid="2">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" vid="3">
<title vid="4">Seasons - Cycle Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" vid="5">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" vid="6">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Inter:wght@300;400;500&amp;display=swap" rel="stylesheet" vid="7">
<style vid="8">
    :root {
        --bg: #FCFBFC;
        --text-main: #2D2C2A;
        --text-light: #8A8883;
        --scrap-bg: #F5F0E6;
        --violet: #8E2BBA;
        --plum: #80264D;
        --yellow: #F4E8C2;
        --green: #666D46;
        --serif: 'Cormorant Garamond', serif;
        --sans: 'Inter', sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    body {
        background-color: var(--bg);
        color: var(--text-main);
        font-family: var(--sans);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
    }

    
    
    header {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 8vh 6vw 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 10;
        pointer-events: none; 
    }

    .meta-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .label {
        font-family: var(--sans);
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-light);
        font-weight: 500;
    }

    .value {
        font-family: var(--serif);
        font-size: 1.4rem;
        font-style: italic;
        color: var(--text-main);
        line-height: 1;
    }

    .phase-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 12px;
    }

    .dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background-color: var(--text-light);
        opacity: 0.3;
        transition: all 0.3s ease;
    }

    .dot.active {
        background-color: var(--violet);
        opacity: 1;
        transform: scale(1.5);
    }

    

    .canvas {
        flex: 1;
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    .flower {
        position: absolute;
        pointer-events: none;
        mix-blend-mode: multiply; 
        filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.03));
    }

    
    .f-violet {
        top: 55%;
        left: 5%;
        width: 140px;
        transform: rotate(-15deg);
    }

    .f-yellow {
        top: 8%;
        left: 15%;
        width: 160px;
        transform: rotate(10deg);
    }

    .f-yellow-bottom {
        bottom: 12%;
        right: 10%;
        width: 180px;
        transform: rotate(-5deg);
    }

    .f-plum {
        top: 35%;
        left: 38%;
        width: 90px;
        transform: rotate(25deg);
    }

    .f-violet-small {
        top: 12%;
        right: 12%;
        width: 100px;
        transform: rotate(45deg);
    }

    

    .poetry-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    .scrap {
        position: absolute;
        background-color: var(--scrap-bg);
        color: var(--text-main);
        font-family: var(--serif);
        font-size: 1.25rem;
        padding: 4px 8px 3px;
        line-height: 1;
        box-shadow: 
            1px 1.5px 3px rgba(0,0,0,0.06),
            inset 0.5px 0.5px 0px rgba(255,255,255,0.8);
        white-space: nowrap;
        pointer-events: auto; 
        cursor: default;
    }

    
    .w-this { top: 28%; left: 30%; transform: rotate(-2deg); }
    .w-will { top: 48%; left: 20%; transform: rotate(1deg); }
    .w-pass { top: 28%; left: 45%; transform: rotate(-1deg); }
    
    .w-and { top: 32%; left: 68%; transform: rotate(2deg); }
    .w-we { top: 45%; left: 58%; transform: rotate(-3deg); }
    
    .w-never { top: 62%; left: 35%; transform: rotate(1deg); }
    .w-be { top: 75%; left: 48%; transform: rotate(-2deg); }
    .w-the { top: 82%; left: 25%; transform: rotate(3deg); }
    .w-same { top: 90%; left: 52%; transform: rotate(-1deg); }

    .w-this2 { top: 10%; right: 28%; transform: rotate(1deg); }
    .w-will2 { top: 20%; right: 42%; transform: rotate(-2deg); }

    

    .insight-drawer {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 0 6vw 8vh;
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        
        background: linear-gradient(to top, var(--bg) 40%, rgba(252,251,252,0.8) 70%, rgba(252,251,252,0) 100%);
        pointer-events: auto;
    }

    .insight-drawer::before {
        content: '';
        display: block;
        width: 1px;
        height: 40px;
        background-color: var(--text-light);
        opacity: 0.3;
        margin-left: 2px;
        margin-bottom: 8px;
    }

    .insight-title {
        font-family: var(--serif);
        font-size: 2rem;
        font-weight: 400;
        color: var(--violet);
        line-height: 1.1;
        letter-spacing: -0.02em;
    }

    .insight-body {
        font-family: var(--serif);
        font-size: 1.1rem;
        line-height: 1.5;
        color: var(--text-main);
        max-width: 85%;
    }

    .action-row {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 8px;
    }

    .log-btn {
        background: none;
        border: 1px solid rgba(45, 44, 42, 0.15);
        padding: 10px 20px;
        border-radius: 100px;
        font-family: var(--sans);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-main);
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .log-btn:active {
        background: var(--text-main);
        color: var(--bg);
    }

    
    .svg-defs { width: 0; height: 0; position: absolute; }

</style>
</head>
